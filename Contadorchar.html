<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de caracters</title>
    <style>
body {
    display: flex;
    justify-content: center; 
    align-items: center;     
    height: 950px;           
    font-family: Arial, sans-serif;
    background-color: #084f91;
  }
  .contador {
    background-color: #086fe4;
    padding: 20px;
    border: 1px solid #0744eb;
    border-radius: 8px;
    width: 300px;
  }
  textarea {
    width: 100%;
    height: 100px;
  }

  p {
    margin: 5px 0;
  }
 </style>  
</head>
<body>
    <div class="contador">
  <h2>Contador de caracteres y palabras</h2>
  <textarea id="texto" oninput="contar()" placeholder="Escribe tu texto aquí..."></textarea>
  <p>Caracteres: <span id="chart">0</span></p>
  <p>Palabras: <span id="word">0</span></p>
</div>
<script src="codigo.js"></script>
</body>
</html>
